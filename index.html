  const db = initializeFirestore(app, {
    experimentalForceLongPolling: true,
    useFetchStreams: false
  });
async function loadItems() {
  const container = document.getElementById("guards-container");
  try {
    const response = await fetch("https://test1-i3gc.onrender.com/api/get-data");
    const data = await response.json();
    
    if (!data || data.length === 0) {
      container.innerHTML = "No documents found in 'guards' collection.";
      return;
    }

    container.innerHTML = ""; 
    data.forEach((doc) => {
      const card = document.createElement("div");
      card.className = "guard-card";
      card.innerHTML = `<strong>ID:</strong> ${doc.id}<br><strong>Data:</strong> ${JSON.stringify(doc)}`;
      container.appendChild(card);
    });
  } catch (error) {
    console.error("Error loading items:", error);
    container.innerHTML = "Error loading data. Check console for details.";
  }
}

loadItems();
</script>
